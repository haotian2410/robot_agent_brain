name: brain-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: pytest brain_tests/
      - run: python -m pip wheel --wheel-dir wheelhouse .
      - run: python -m venv /tmp/brain-wheel-env
      - run: /tmp/brain-wheel-env/bin/python -m pip install --no-index --find-links "$GITHUB_WORKSPACE/wheelhouse" robot-agent-brain
      - run: cd /tmp && /tmp/brain-wheel-env/bin/python -c "import robot_agent_brain; from robot_agent_brain.models.prompts import TASK_UNDERSTANDING_PROMPT; assert TASK_UNDERSTANDING_PROMPT"
