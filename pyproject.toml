[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "robot-agent-brain"
version = "0.1.0"
description = "Simulator-independent semantic planning brain for robot agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/robot_agent_brain"]

[tool.pytest.ini_options]
testpaths = ["brain_tests"]
addopts = "-q"
pythonpath = ["src"]
